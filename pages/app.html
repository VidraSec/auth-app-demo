<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{APP_NAME}}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 0 1rem; line-height: 1.5; }
    nav { padding: .8rem 0; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
    nav a { margin-right: 1.5rem; }
    button { padding: .3rem 1rem; margin-right: .5rem; cursor: pointer; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 4px; white-space: pre-wrap; word-break: break-all; font-size: 13px; min-height: 2rem; }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <nav><a href="{{auth}}/">Login</a> <a href="{{app1}}/">App 1</a> <a href="{{app2}}/">App 2</a></nav>
  <h1 id="host">{{APP_NAME}}</h1>
  <p>Status: <b id="status">checking…</b></p>
  <p>
    <button id="api">Call protected API</button>
    <button id="other-api">Use token on {{OTHER_APP_NAME}}'s API</button>
    <button id="xss">Run XSS test</button>
    <button id="logout">Log out</button>
  </p>
  <pre id="log"></pre>
</body>
</html>
